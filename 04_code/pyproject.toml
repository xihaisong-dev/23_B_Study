[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-integer-approx"
version = "0.1.0"
description = "Compute-side scaffold for 2023 Huawei Cup problem B (DFT integer factorization approximation)."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
